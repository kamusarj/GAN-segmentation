version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: gan_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gan_segmentation
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: gan_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/code/app
      - ./last_generator.pth:/code/last_generator.pth
      - ./models:/code/models
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/gan_segmentation
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: gan_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
